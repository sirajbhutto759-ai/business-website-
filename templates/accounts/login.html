{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Siraj UPS and Solar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 420px; width: 100%; background: #ffffff;">
        <div class="card-body text-center p-3">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 70px; height: 70px;">
                <i class="fa-solid fa-bolt fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">SIRAJ UPS & SOLAR</h4>
            <p class="text-muted small mb-4">Shop Billing & Inventory Management</p>

            {% if form.errors %}
                <div class="alert alert-danger py-2 small" role="alert">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label class="form-label small fw-semibold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" class="form-control bg-light border-start-0" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control bg-light border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm rounded-3 mb-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                </button>
            </form>
            <p class="text-muted style-sub mt-4 mb-0" style="font-size: 0.75rem;">Default Login: <strong>admin</strong> / <strong>admin123</strong></p>
        </div>
    </div>
</body>
</html>
