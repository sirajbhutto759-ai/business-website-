{% extends 'base.html' %}
{% block title %}Deactivate Customer{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 text-center">
                <i class="fa-solid fa-triangle-exclamation text-warning fs-1 mb-3"></i>
                <h5 class="fw-bold text-dark">Confirm Customer Deactivation</h5>
                <p class="text-muted">Are you sure you want to deactivate customer <strong>{{ customer.name }}</strong>?</p>
                
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'customers:customer_list' %}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold">Deactivate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
