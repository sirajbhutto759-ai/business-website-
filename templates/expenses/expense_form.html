{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-receipt me-2 text-danger"></i>{{ title }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Expense Category <span class="text-danger">*</span></label>
                        {{ form.category }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Expense Date</label>
                        {{ form.expense_date }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Amount (Rs.) <span class="text-danger">*</span></label>
                        {{ form.amount }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Payment Method</label>
                        {{ form.payment_method }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description / Payee</label>
                        {{ form.description }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Notes</label>
                        {{ form.notes }}
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'expenses:expense_list' %}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-bold"><i class="fa-solid fa-save me-1"></i> Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
